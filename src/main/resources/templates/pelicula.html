<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head th:insert="~{layouts/head}">

</head>

<body>
	<div th:insert="~{layouts/header}"></div>

	<div class="container">

		<form th:action="@{/pelicula}" th:object="${pelicula}" method="post" class="col-md-8 offset-md-2"
			enctype="multipart/form-data">
			<h2 th:text="${titulo}" class="py-4"></h2>
			<div class="row mb-3">
				<label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
				<div class="col-sm-10">
					<input type="text" class="form-control" id="nombre" th:field="*{nombre}">
					<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">

					</div>
				</div>
			</div>
			<div class="row mb-3">
				<label for="fechaEstreno" class="col-sm-2 col-form-label">Fecha de estreno</label>
				<div class="col-sm-10">
					<input type="date" class="form-control" id="fechaEstreno" th:field="*{fechaEstreno}">
					<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fechaEstreno')}"
						th:errors="*{fechaEstreno}">

					</div>
				</div>
			</div>
			<div class="row mb-3">
				<label for="genero" class="col-sm-2 col-form-label">Género</label>
				<div class="col-sm-10">
					<select class="form-select" th:field="*{genero}">
						<option th:each="genero : ${generos}" th:text="${genero.nombre}" th:value="${genero.id}">
						</option>
					</select>
					<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}">

					</div>
				</div>
			</div>
			<div class="row mb-3">
				<label for="protagonistas" class="col-sm-2 col-form-label">Actor</label>
				<div class="col-sm-10">
					<select class="form-select" id="protagonistas" onchange="actorSelected(this)">
						<option th:text="'Seleccionar actor'" th:value="0"></option>
						<option th:each="actor : ${actores}" th:text="${actor.nombre}" th:value="${actor.id}"
							th:attr="data-url=${actor.urlImagen}">
						</option>
					</select>
				</div>
			</div>

			<div class="row mb-3">
				<label for="archivo_img" class="col-sm-2 col-form-label">Imagen</label>
				<div class="col-sm-10">
					<input type="file" id="archivo_img" name="archivo_img" onchange="previsualizar()">
					<div id="vista_previa" class="d-none">

					</div>
				</div>
			</div>

			<input id="ids" name="ids" type="text" th:value="${ids}">
			<input id="id" name="id" type="text" th:field="*{id}">
			<input id="imagen" name="imagen" type="text" th:field="*{imagen}">
			<div id="protagonistas_container" class="row">

				<div th:each="actor : ${pelicula.protagonistas}" class="card col-md-3 m-2" style="width: 10rem">

					<img th:src="${actor.urlImagen}" class="card-img-top">

					<div class="card-body">

						<p class="card-text" th:text="${actor.nombre}">
						</p>

						<button class="btn btn-danger" th:data-id="${actor.id}"
							onclick="eliminarActor(this); return false;">
							Eliminar
						</button>

					</div>
				</div>

			</div>

			<button type="submit" class="btn btn-primary float-end">Guardar</button>
		</form>

	</div>

</body>

</html>
